<script>

let scanner = null;
let running = false;
let completed = false;


/* ==========================================
   STATUS
========================================== */

function status(message, type) {

  const el =
    document.getElementById('status');

  el.textContent = message;

  el.className = type || '';

}


/* ==========================================
   EKSTRAK ID DARIPADA QR
========================================== */

function extractId(text) {

  let value =
    String(text || '').trim();


  /*
   * Jika QR mengandungi URL,
   * cuba ambil ?id=
   */
  try {

    const url =
      new URL(value);

    const id =
      url.searchParams.get('id');

    if (id) {
      value = id;
    }

  } catch (e) {

    /*
     * Bukan URL.
     * Anggap terus sebagai ID.
     */

  }


  return value
    .trim()
    .toUpperCase();

}


/* ==========================================
   MULAKAN KAMERA
========================================== */

async function startCamera() {

  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    status(
      '❌ Library QR gagal dimuat.',
      'err'
    );

    return;
  }


  try {

    scanner =
      new Html5Qrcode('reader');


    const config = {

      fps: 10,

      qrbox: function(width, height) {

        const size =
          Math.floor(
            Math.min(width, height) * 0.72
          );

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0

    };


    await scanner.start(

      {
        facingMode: 'environment'
      },

      config,

      function(decodedText) {

        if (completed) {
          return;
        }


        const id =
          extractId(decodedText);


        if (!id) {

          status(
            '❌ QR tidak mengandungi ID murid.',
            'err'
          );

          return;
        }


        /*
         * Pastikan ID mempunyai format
         * seperti 6AG-001
         */
        if (
          !/^(6AG|5AG|5AJ)-\d{3}$/i.test(id)
        ) {

          status(
            '❌ QR dibaca tetapi ID tidak sah: ' +
            id,
            'err'
          );

          return;
        }


        completed = true;


        status(
          '✅ QR dibaca: ' + id,
          'ok'
        );


        finishScan(id);

      },

      function(errorMessage) {

        /*
         * Jangan paparkan setiap frame gagal.
         */

      }

    );


    running = true;


    status(
      '📷 Kamera aktif — halakan kepada QR murid.'
    );

  }

  catch (error) {

    console.error(
      'Camera error:',
      error
    );


    status(
      '❌ Kamera tidak dapat dibuka. ' +
      'Pastikan Camera = Allow dan scanner dibuka melalui HTTPS.',
      'err'
    );

  }

}


/* ==========================================
   SELEPAS QR BERJAYA
========================================== */

async function finishScan(id) {

  /*
   * Hentikan kamera
   */
  try {

    if (
      scanner &&
      running
    ) {

      await scanner.stop();

      running = false;

    }

  }

  catch (e) {

    console.log(
      'Scanner stop:',
      e
    );

  }


  /*
   * Ambil parameter daripada URL Scanner.html
   */
  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get('returnUrl');


  const code =
    params.get('code');


  /*
   * Pastikan returnUrl wujud
   */
  if (!returnUrl) {

    status(
      '❌ URL QR AKTIF tidak ditemui.',
      'err'
    );

    return;
  }


  /*
   * Pastikan callback code wujud
   */
  if (!code) {

    status(
      '❌ Callback code tidak ditemui.',
      'err'
    );

    return;
  }


  /*
   * Bina URL kembali ke Apps Script
   *
   * ?id=6AG-001
   * &code=XXXXXXXX
   */
  try {

    const url =
      new URL(returnUrl);


    url.searchParams.set(
      'id',
      id
    );


    url.searchParams.set(
      'code',
      code
    );


    const destination =
      url.toString();


    status(
      '✅ QR ' +
      id +
      ' berjaya dibaca. Kembali ke QR AKTIF...',
      'ok'
    );


    /*
     * Beri masa supaya guru nampak
     * mesej berjaya.
     */
    setTimeout(function() {

      window.location.replace(
        destination
      );

    }, 500);

  }

  catch (error) {

    console.error(error);

    status(
      '❌ URL QR AKTIF tidak sah.',
      'err'
    );

  }

}


/* ==========================================
   TUTUP SCANNER
========================================== */

async function closeScanner() {

  try {

    if (
      scanner &&
      running
    ) {

      await scanner.stop();

    }

  }

  catch (e) {}


  running = false;


  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get('returnUrl');


  if (returnUrl) {

    window.location.replace(
      returnUrl
    );

  }

  else {

    window.history.back();

  }

}


/* ==========================================
   MULAKAN
========================================== */

window.addEventListener(
  'load',
  function() {

    startCamera();

  }
);

</script>

</body>
</html>
