<!DOCTYPE html>
<html lang="ms">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>QR AKTIF! — Scanner</title>

  <!-- HTML5 QR CODE -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #101820;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .header {
      text-align: center;
      padding: 10px 5px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      color: #cbd5e1;
    }

    .scanner-card {
      background: white;
      color: #17202a;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: black;
    }

    #reader video {
      border-radius: 15px;
    }

    .instruction {
      background: #eef6ff;
      color: #145a8d;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .status {
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      line-height: 1.4;
    }

    .status-info {
      background: #eaf3fb;
      color: #145a8d;
    }

    .status-success {
      background: #e8f7ec;
      color: #176b2c;
    }

    .status-error {
      background: #fdecec;
      color: #9b1c1c;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .retry-button {
      background: #1769aa;
      color: white;
    }

    .close-button {
      background: #a61b1b;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-top: 20px;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>📷 QR AKTIF!</h1>

    <p>
      Scanner QR Murid
    </p>

  </div>


  <div class="scanner-card">

    <div class="instruction">

      <strong>Cara mengimbas:</strong>

      <br>

      1. Benarkan akses kamera.

      <br>

      2. Halakan kamera kepada QR murid.

      <br>

      3. Pastikan QR jelas di dalam kotak kamera.

      <br>

      4. Sistem akan membaca ID secara automatik.

    </div>


    <div id="reader"></div>


    <div
      id="status"
      class="status status-info"
    >
      ⏳ Menyediakan kamera...
    </div>


    <button
      id="retryButton"
      class="retry-button hidden"
      onclick="restartCamera()"
    >
      🔄 CUBA KAMERA SEMULA
    </button>


    <button
      class="close-button"
      onclick="closeScanner()"
    >
      ✕ BATAL & KEMBALI
    </button>

  </div>


  <div class="footer">

    Sistem Mata Aktiviti Murid
    <br>
    Sekolah Kebangsaan Cheras Jaya

  </div>

</div>


<script>

  /* =============================================
     PEMBOLEH UBAH
     ============================================= */

  let scanner = null;

  let running = false;

  let completed = false;

  let starting = false;


  /*
   * Data daripada Index.html
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get(
      'returnUrl'
    );


  const callbackCode =
    params.get(
      'code'
    );


  /* =============================================
     PAPAR STATUS
     ============================================= */

  function showStatus(
    message,
    type
  ) {

    const element =
      document.getElementById(
        'status'
      );


    element.textContent =
      message;


    element.className =
      'status';


    if (
      type === 'success'
    ) {

      element.classList.add(
        'status-success'
      );

    }

    else if (
      type === 'error'
    ) {

      element.classList.add(
        'status-error'
      );

    }

    else {

      element.classList.add(
        'status-info'
      );

    }

  }


  /* =============================================
     DAPATKAN ID DARIPADA QR
     ============================================= */

  function extractId(
    decodedText
  ) {

    let text =
      String(
        decodedText || ''
      )
        .trim();


    if (!text) {
      return '';
    }


    /*
     * Jika QR mengandungi URL:
     *
     * https://xxxx?id=6AG-001
     */

    try {

      const url =
        new URL(text);


      const id =
        url.searchParams.get(
          'id'
        );


      if (id) {

        return String(id)
          .trim()
          .toUpperCase();

      }

    }

    catch (error) {

      /*
       * Bukan URL.
       * Terus gunakan teks QR.
       */

    }


    /*
     * QR biasa:
     *
     * 6AG-001
     */

    return text
      .trim()
      .toUpperCase();

  }


  /* =============================================
     VALIDASI ID MURID
     ============================================= */

  function isValidStudentId(
    id
  ) {

    /*
     * Format yang diterima:
     *
     * 6AG-001
     * 5AG-001
     * 5AJ-001
     *
     * 001 hingga 999 diterima pada scanner.
     * Google Apps Script akan buat semakan
     * sebenar dalam Sheet MURID.
     */

    return /^(6AG|5AG|5AJ)-\d{3}$/i
      .test(
        String(id || '')
          .trim()
      );

  }


  /* =============================================
     MULAKAN KAMERA
     ============================================= */

  async function startCamera() {

    if (
      starting ||
      running ||
      completed
    ) {

      return;

    }


    /*
     * Pastikan URL callback lengkap.
     */

    if (
      !returnUrl ||
      !callbackCode
    ) {

      showStatus(
        '❌ Maklumat scanner tidak lengkap. Sila kembali ke QR AKTIF dan tekan SCAN QR semula.',
        'error'
      );


      document
        .getElementById(
          'retryButton'
        )
        .classList
        .add('hidden');


      return;
    }


    /*
     * Pastikan library berjaya dimuatkan.
     */

    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      showStatus(
        '❌ Library QR tidak dapat dimuatkan. Semak sambungan Internet dan cuba semula.',
        'error'
      );


      document
        .getElementById(
          'retryButton'
        )
        .classList
        .remove('hidden');


      return;
    }


    starting = true;


    document
      .getElementById(
        'retryButton'
      )
      .classList
      .add('hidden');


    showStatus(
      '📷 Meminta akses kamera...',
      'info'
    );


    try {

      scanner =
        new Html5Qrcode(
          'reader'
        );


      /*
       * Cuba gunakan kamera belakang.
       */

      await scanner.start(

        {
          facingMode: {
            ideal: 'environment'
          }
        },

        {
          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minimum =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            const size =
              Math.floor(
                minimum * 0.72
              );


            return {
              width: size,
              height: size
            };

          },

          aspectRatio: 1.0

        },


        /*
         * QR berjaya dibaca.
         */

        function(
          decodedText
        ) {

          handleSuccessfulScan(
            decodedText
          );

        },


        /*
         * QR belum dijumpai.
         *
         * Jangan papar error kerana callback
         * ini berlaku berkali-kali ketika
         * kamera sedang mencari QR.
         */

        function(
          errorMessage
        ) {

          // Abaikan.

        }

      );


      running = true;

      starting = false;


      showStatus(
        '📷 Kamera aktif. Halakan kepada QR murid.',
        'info'
      );

    }

    catch (error) {

      starting = false;

      running = false;


      console.error(
        'Camera error:',
        error
      );


      showStatus(
        '❌ Kamera tidak dapat dibuka. Pastikan kebenaran kamera telah diberikan kepada browser.',
        'error'
      );


      document
        .getElementById(
          'retryButton'
        )
        .classList
        .remove('hidden');

    }

  }


  /* =============================================
     QR BERJAYA
     ============================================= */

  async function handleSuccessfulScan(
    decodedText
  ) {

    /*
     * Elakkan QR yang sama diproses
     * berkali-kali.
     */

    if (completed) {
      return;
    }


    const studentId =
      extractId(
        decodedText
      );


    if (!studentId) {

      showStatus(
        '❌ QR tidak mengandungi ID murid.',
        'error'
      );

      return;
    }


    /*
     * Elakkan QR rawak / bukan QR murid.
     */

    if (
      !isValidStudentId(
        studentId
      )
    ) {

      showStatus(
        '⚠️ QR bukan ID murid QR AKTIF. Sila imbas QR murid yang betul.',
        'error'
      );

      return;
    }


    /*
     * Kunci scanner.
     */

    completed = true;


    showStatus(
      '✅ QR berjaya dibaca: ' +
      studentId,
      'success'
    );


    /*
     * Hentikan kamera.
     */

    await stopCamera();


    /*
     * Hantar:
     *
     * id = ID murid
     * code = callback keselamatan
     *
     * Code.gs akan tukarkan code kepada
     * sessionToken guru.
     */

    try {

      const destination =
        new URL(
          returnUrl
        );


      destination
        .searchParams
        .set(
          'id',
          studentId
        );


      destination
        .searchParams
        .set(
          'code',
          callbackCode
        );


      showStatus(
        '✅ ' +
        studentId +
        ' dikesan. Kembali ke QR AKTIF...',
        'success'
      );


      /*
       * Beri sedikit masa supaya guru
       * nampak mesej berjaya.
       */

      setTimeout(
        function() {

          window.location.replace(
            destination.toString()
          );

        },
        500
      );

    }

    catch (error) {

      console.error(
        'Return URL error:',
        error
      );


      completed = false;


      showStatus(
        '❌ Tidak dapat kembali ke QR AKTIF. Sila tekan BATAL & KEMBALI dan cuba semula.',
        'error'
      );

    }

  }


  /* =============================================
     HENTIKAN KAMERA
     ============================================= */

  async function stopCamera() {

    if (!scanner) {

      running = false;

      return;

    }


    if (running) {

      try {

        await scanner.stop();

      }

      catch (error) {

        console.log(
          'Stop camera:',
          error
        );

      }

    }


    running = false;


    try {

      scanner.clear();

    }

    catch (error) {

      // Abaikan.

    }

  }


  /* =============================================
     CUBA SEMULA
     ============================================= */

  async function restartCamera() {

    completed = false;

    starting = false;


    await stopCamera();


    scanner = null;


    const reader =
      document.getElementById(
        'reader'
      );


    reader.innerHTML = '';


    startCamera();

  }


  /* =============================================
     BATAL / KEMBALI
     ============================================= */

  async function closeScanner() {

    completed = true;


    showStatus(
      '⏳ Kembali ke QR AKTIF...',
      'info'
    );


    await stopCamera();


    if (returnUrl) {

      try {

        const destination =
          new URL(
            returnUrl
          );


        /*
         * Tidak hantar id/code apabila
         * pengguna membatalkan scan.
         */

        window.location.replace(
          destination.toString()
        );


        return;

      }

      catch (error) {

        console.error(
          error
        );

      }

    }


    /*
     * Fallback jika tiada returnUrl.
     */

    if (
      window.history.length > 1
    ) {

      window.history.back();

    }

    else {

      showStatus(
        'Scanner telah ditutup. Anda boleh menutup tab ini.',
        'info'
      );

    }

  }


  /* =============================================
     BERSIHKAN KAMERA JIKA HALAMAN DITUTUP
     ============================================= */

  window.addEventListener(
    'pagehide',
    function() {

      if (
        scanner &&
        running
      ) {

        try {

          scanner.stop();

        }

        catch (error) {}

      }

    }
  );


  /* =============================================
     MULA
     ============================================= */

  window.addEventListener(
    'load',
    function() {

      startCamera();

    }
  );

</script>

</body>
</html>
