<!DOCTYPE html>

    }

<body>

<div class="container">


  <!-- ================================
       HEADER
       ================================ -->

  <div class="header">

    <h1>📷 QR AKTIF!</h1>

    <p>Scanner QR Murid</p>

  </div>


  <!-- ================================
       SCANNER CARD
       ================================ -->

  <div class="scanner-card">


    <div class="instruction">

      <strong>Cara mengimbas:</strong>

      <br>

      1. Tekan <strong>AKTIFKAN KAMERA</strong>.

      <br>

      2. Benarkan akses kamera.

      <br>

      3. Halakan kamera kepada QR murid.

      <br>

      4. Sistem akan membaca ID murid secara automatik.

    </div>


    <!-- Kamera -->

    <div id="reader"></div>


    <!-- Status -->

    <div
      id="status"
      class="status status-info"
    >
      Tekan AKTIFKAN KAMERA untuk bermula.
    </div>


    <!-- Kandungan QR -->

    <div
      id="qrContent"
      class="qr-content hidden"
    ></div>


    <!-- Debug -->

    <div
      id="debug"
      class="debug hidden"
    ></div>


    <!-- Butang mula -->

    <button
      id="startButton"
      class="start-button"
      onclick="startCamera()"
    >
      📷 AKTIFKAN KAMERA
    </button>


    <!-- Butang cuba semula -->

    <button
      id="retryButton"
      class="retry-button hidden"
      onclick="restartCamera()"
    >
      🔄 CUBA KAMERA SEMULA
    </button>


    <!-- Butang batal -->

    <button
      class="close-button"
      onclick="closeScanner()"
    >
      ✕ BATAL & KEMBALI
    </button>


  </div>


  <!-- ================================
       FOOTER
       ================================ -->

  <div class="footer">

    Sistem Mata Aktiviti Murid

    <br>

    Sekolah Kebangsaan Cheras Jaya

  </div>


</div>



<script>


/* ==========================================================
   PEMBOLEH UBAH GLOBAL
   ========================================================== */

let scanner = null;

let running = false;

let starting = false;

let completed = false;

let processingScan = false;


/*
 * Ambil parameter daripada URL.
 *
 * returnUrl = URL Google Apps Script
 * code      = kod callback sementara
 */

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get('returnUrl');


const callbackCode =
  params.get('code');



/* ==========================================================
   PAPAR STATUS
   ========================================================== */

function showStatus(
  message,
  type
) {

  const element =
    document.getElementById(
      'status'
    );


  element.textContent =
    message;


  element.className =
    'status';


  if (
    type === 'success'
  ) {

    element.classList.add(
      'status-success'
    );

  }

  else if (
    type === 'error'
  ) {

    element.classList.add(
      'status-error'
    );

  }

  else {

    element.classList.add(
      'status-info'
    );

  }

}



/* ==========================================================
   PAPAR KANDUNGAN QR
   ========================================================== */

function showQrContent(
  text
) {

  const box =
    document.getElementById(
      'qrContent'
    );


  box.classList.remove(
    'hidden'
  );


  box.textContent =
    'Kandungan QR yang dibaca: ' +
    String(text || '');

}


function hideQrContent() {

  const box =
    document.getElementById(
      'qrContent'
    );


  box.classList.add(
    'hidden'
  );


  box.textContent = '';

}



/* ==========================================================
   DEBUG
   ========================================================== */

function showDebug(
  message
) {

  const box =
    document.getElementById(
      'debug'
    );


  box.classList.remove(
    'hidden'
  );


  box.textContent =
    message;

}


function hideDebug() {

  const box =
    document.getElementById(
      'debug'
    );


  box.classList.add(
    'hidden'
  );


  box.textContent = '';

}



/* ==========================================================
   FORMAT ERROR
   ========================================================== */

function errorText(
  error
) {

  if (!error) {

    return 'Ralat tidak diketahui.';

  }


  if (
    typeof error === 'string'
  ) {

    return error;

  }


  let output = '';


  if (error.name) {

    output +=
      'Nama ralat: ' +
      error.name;

  }


  if (error.message) {

    if (output) {

      output += '\n';

    }


    output +=
      'Mesej: ' +
      error.message;

  }


  if (!output) {

    try {

      output =
        JSON.stringify(
          error
        );

    }

    catch (e) {

      output =
        String(error);

    }

  }


  return output;

}



/* ==========================================================
   SEMAK PERSEKITARAN BROWSER
   ========================================================== */

function checkEnvironment() {

  /*
   * GitHub Pages sepatutnya menggunakan HTTPS.
   */

  if (
    window.location.protocol !==
    'https:'
  ) {

    showStatus(
      '❌ Kamera memerlukan sambungan HTTPS.',
      'error'
    );


    showDebug(
      'URL semasa: ' +
      window.location.href
    );


    return false;

  }


  /*
   * Semak fungsi kamera browser.
   */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      '❌ Browser ini tidak menyediakan akses kamera.',
      'error'
    );


    showDebug(
      'navigator.mediaDevices.getUserMedia tidak tersedia.'
    );


    return false;

  }


  return true;

}



/* ==========================================================
   EXTRACT ID MURID DARIPADA QR
   ========================================================== */

function extractId(
  decodedText
) {

  /*
   * Tukarkan semua kepada teks,
   * buang ruang depan/belakang,
   * kemudian uppercase.
   */

  const text =
    String(
      decodedText || ''
    )
    .trim()
    .toUpperCase();


  if (!text) {

    return '';

  }


  /*
   * FORMAT ID YANG DITERIMA:
   *
   * 6AG-001
   * 5AG-001
   * 5AJ-001
   *
   * Fungsi ini juga boleh membaca:
   *
   * ID: 6AG-001
   *
   * atau:
   *
   * https://contoh.com/?id=6AG-001
   *
   * atau QR yang mempunyai ruang:
   *
   * 6AG - 001
   */


  const match =
    text.match(
      /(6AG|5AG|5AJ)\s*-\s*(\d{3})/i
    );


  if (match) {

    return (
      match[1].toUpperCase() +
      '-' +
      match[2]
    );

  }


  /*
   * Jika tiada ID dijumpai.
   */

  return '';

}



/* ==========================================================
   VALIDASI ID MURID
   ========================================================== */

function isValidStudentId(
  id
) {

  return /^(6AG|5AG|5AJ)-\d{3}$/i
    .test(
      String(
        id || ''
      )
      .trim()
    );

}



/* ==========================================================
   PILIH KAMERA
   ========================================================== */

function chooseCamera(
  cameras
) {

  if (
    !cameras ||
    !cameras.length
  ) {

    return null;

  }


  /*
   * Nama yang biasa digunakan browser
   * untuk kamera belakang.
   */

  const rearWords = [

    'back',

    'rear',

    'environment',

    'belakang',

    'world'

  ];


  /*
   * Cari kamera belakang berdasarkan label.
   */

  for (
    let i = 0;
    i < cameras.length;
    i++
  ) {

    const label =
      String(
        cameras[i].label || ''
      )
      .toLowerCase();


    for (
      let j = 0;
      j < rearWords.length;
      j++
    ) {

      if (
        label.includes(
          rearWords[j]
        )
      ) {

        return cameras[i];

      }

    }

  }


  /*
   * Jika browser tidak memberi label jelas,
   * gunakan kamera terakhir.
   *
   * Pada kebanyakan telefon,
   * kamera belakang berada selepas
   * kamera hadapan.
   */

  return cameras[
    cameras.length - 1
  ];

}



/* ==========================================================
   MINTA KEBENARAN KAMERA
   ========================================================== */

async function requestCameraPermission() {

  let stream = null;


  try {

    /*
     * Minta akses kamera asas.
     */

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: true,

          audio: false

        });


    /*
     * Permission sudah diberikan.
     *
     * Tutup stream sementara kerana
     * Html5Qrcode akan membuka kamera
     * sekali lagi.
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    return true;

  }

  catch (error) {

    /*
     * Pastikan stream dihentikan
     * jika berlaku error.
     */

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }


    throw error;

  }

}



/* ==========================================================
   MULAKAN KAMERA
   ========================================================== */

async function startCamera() {

  /*
   * Elakkan scanner dimulakan dua kali.
   */

  if (
    starting ||
    running ||
    completed
  ) {

    return;

  }


  hideDebug();

  hideQrContent();


  /*
   * Scanner mesti dibuka daripada
   * sistem QR AKTIF.
   */

  if (
    !returnUrl ||
    !callbackCode
  ) {

    showStatus(
      '❌ Scanner perlu dibuka melalui QR AKTIF.',
      'error'
    );


    showDebug(
      'returnUrl: ' +
      (
        returnUrl
          ? 'ADA'
          : 'TIADA'
      ) +
      '\n' +
      'callback code: ' +
      (
        callbackCode
          ? 'ADA'
          : 'TIADA'
      )
    );


    return;

  }


  /*
   * Semak browser.
   */

  if (
    !checkEnvironment()
  ) {

    return;

  }


  /*
   * Semak library html5-qrcode.
   */

  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    showStatus(
      '❌ Sistem QR tidak berjaya dimuatkan.',
      'error'
    );


    showDebug(
      'Library Html5Qrcode tidak ditemui.'
    );


    return;

  }


  starting = true;

  completed = false;

  processingScan = false;


  /*
   * Sembunyikan butang mula.
   */

  document
    .getElementById(
      'startButton'
    )
    .classList
    .add(
      'hidden'
    );


  /*
   * Sembunyikan retry.
   */

  document
    .getElementById(
      'retryButton'
    )
    .classList
    .add(
      'hidden'
    );


  showStatus(
    '⏳ Meminta kebenaran kamera...',
    'info'
  );


  try {


    /* ------------------------------------------------------
       LANGKAH 1
       MINTA PERMISSION
       ------------------------------------------------------ */

    await requestCameraPermission();


    showStatus(
      '⏳ Mengesan kamera...',
      'info'
    );



    /* ------------------------------------------------------
       LANGKAH 2
       DAPATKAN SENARAI KAMERA
       ------------------------------------------------------ */

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'Tiada kamera dikesan pada peranti ini.'
      );

    }



    /* ------------------------------------------------------
       LANGKAH 3
       PILIH KAMERA BELAKANG
       ------------------------------------------------------ */

    const chosenCamera =
      chooseCamera(
        cameras
      );


    if (!chosenCamera) {

      throw new Error(
        'Kamera tidak dapat dipilih.'
      );

    }



    /* ------------------------------------------------------
       LANGKAH 4
       BERSIHKAN READER
       ------------------------------------------------------ */

    const reader =
      document.getElementById(
        'reader'
      );


    reader.innerHTML = '';



    /* ------------------------------------------------------
       LANGKAH 5
       CIPTA SCANNER
       ------------------------------------------------------ */

    scanner =
      new Html5Qrcode(
        'reader'
      );


    showStatus(
      '⏳ Membuka kamera...',
      'info'
    );



    /* ------------------------------------------------------
       LANGKAH 6
       MULAKAN SCANNER
       ------------------------------------------------------ */

    await scanner.start(

      chosenCamera.id,


      {

        fps: 10,


        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const minimum =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );


          const size =
            Math.floor(
              minimum * 0.70
            );


          return {

            width: size,

            height: size

          };

        }

      },


      /*
       * QR BERJAYA DIBACA.
       */

      function(
        decodedText
      ) {

        handleSuccessfulScan(
          decodedText
        );

      },


      /*
       * QR belum dijumpai.
       *
       * Ini normal dan tidak perlu
       * dipaparkan sebagai error.
       */

      function(
        scanError
      ) {

        // Abaikan.

      }

    );


    running = true;

    starting = false;


    showStatus(
      '📷 Kamera aktif. Halakan kepada QR murid.',
      'success'
    );

  }


  catch (error) {

    starting = false;

    running = false;


    console.error(
      'CAMERA ERROR:',
      error
    );


    showStatus(
      '❌ Kamera gagal dibuka.',
      'error'
    );


    showDebug(
      errorText(error) +
      '\n\nBrowser:\n' +
      navigator.userAgent
    );


    document
      .getElementById(
        'retryButton'
      )
      .classList
      .remove(
        'hidden'
      );

  }

}



/* ==========================================================
   QR BERJAYA DIBACA
   ========================================================== */

async function handleSuccessfulScan(
  decodedText
) {

  /*
   * Elakkan callback scanner berlaku
   * berkali-kali untuk QR yang sama.
   */

  if (
    completed ||
    processingScan
  ) {

    return;

  }


  processingScan = true;


  /*
   * Paparkan kandungan sebenar QR.
   *
   * Ini membantu kita mengenal pasti
   * jika QR mempunyai format lain.
   */

  showQrContent(
    decodedText
  );


  /*
   * Cuba dapatkan ID murid.
   */

  const studentId =
    extractId(
      decodedText
    );


  /*
   * ID tidak dijumpai.
   */

  if (!studentId) {

    showStatus(
      '⚠️ QR ini tidak mengandungi ID murid QR AKTIF.',
      'error'
    );


    /*
     * Benarkan scanner membaca semula
     * selepas sedikit masa.
     */

    setTimeout(
      function() {

        processingScan = false;

      },
      1200
    );


    return;

  }


  /*
   * Semak format ID.
   */

  if (
    !isValidStudentId(
      studentId
    )
  ) {

    showStatus(
      '⚠️ Format ID murid tidak sah: ' +
      studentId,
      'error'
    );


    setTimeout(
      function() {

        processingScan = false;

      },
      1200
    );


    return;

  }



  /* --------------------------------------------------------
     QR SAH
     -------------------------------------------------------- */

  completed = true;


  showStatus(
    '✅ QR berjaya dibaca: ' +
    studentId,
    'success'
  );


  /*
   * Hentikan kamera.
   */

  await stopCamera();



  /* --------------------------------------------------------
     HANTAR BALIK KE QR AKTIF
     -------------------------------------------------------- */

  try {

    const destination =
      new URL(
        returnUrl
      );


    /*
     * Hantar ID murid.
     */

    destination
      .searchParams
      .set(
        'id',
        studentId
      );


    /*
     * Hantar callback code.
     */

    destination
      .searchParams
      .set(
        'code',
        callbackCode
      );


    showStatus(
      '✅ ' +
      studentId +
      ' dikesan. Membuka rekod murid...',
      'success'
    );


    /*
     * Tunggu sebentar supaya guru
     * nampak mesej berjaya.
     */

    setTimeout(
      function() {

        window.location.replace(
          destination.toString()
        );

      },
      700
    );

  }


  catch (error) {

    completed = false;

    processingScan = false;


    showStatus(
      '❌ Tidak dapat kembali ke QR AKTIF.',
      'error'
    );


    showDebug(
      errorText(error)
    );

  }

}



/* ==========================================================
   HENTIKAN KAMERA
   ========================================================== */

async function stopCamera() {

  if (!scanner) {

    running = false;

    return;

  }


  if (running) {

    try {

      await scanner.stop();

    }

    catch (error) {

      console.log(
        'STOP ERROR:',
        error
      );

    }

  }


  running = false;


  try {

    scanner.clear();

  }

  catch (error) {

    // Abaikan.

  }

}



/* ==========================================================
   CUBA KAMERA SEMULA
   ========================================================== */

async function restartCamera() {

  completed = false;

  processingScan = false;

  starting = false;


  await stopCamera();


  scanner = null;


  /*
   * Bersihkan paparan kamera.
   */

  document
    .getElementById(
      'reader'
    )
    .innerHTML = '';


  hideDebug();

  hideQrContent();


  /*
   * Sembunyikan retry.
   */

  document
    .getElementById(
      'retryButton'
    )
    .classList
    .add(
      'hidden'
    );


  /*
   * Paparkan butang mula.
   */

  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove(
      'hidden'
    );


  showStatus(
    'Tekan AKTIFKAN KAMERA untuk mencuba semula.',
    'info'
  );

}



/* ==========================================================
   BATAL & KEMBALI
   ========================================================== */

async function closeScanner() {

  completed = true;


  showStatus(
    '⏳ Kembali ke QR AKTIF...',
    'info'
  );


  await stopCamera();


  /*
   * Jika mempunyai URL sistem,
   * kembali ke sana.
   */

  if (returnUrl) {

    try {

      const destination =
        new URL(
          returnUrl
        );


      window.location.replace(
        destination.toString()
      );


      return;

    }

    catch (error) {

      showDebug(
        errorText(error)
      );

    }

  }


  /*
   * Fallback.
   */

  if (
    window.history.length > 1
  ) {

    window.history.back();

  }

}



/* ==========================================================
   TUTUP KAMERA JIKA HALAMAN DITINGGALKAN
   ========================================================== */

window.addEventListener(
  'pagehide',
  function() {

    if (
      scanner &&
      running
    ) {

      try {

        scanner.stop();

      }

      catch (error) {

        // Abaikan.

      }

    }

  }
);



/* ==========================================================
   APABILA HALAMAN SIAP DIBUKA
   ========================================================== */

window.addEventListener(
  'load',
  function() {


    /*
     * Pastikan scanner dibuka melalui
     * sistem QR AKTIF.
     */

    if (
      !returnUrl ||
      !callbackCode
    ) {

      showStatus(
        '❌ Scanner perlu dibuka melalui butang SCAN QR dalam QR AKTIF.',
        'error'
      );


      showDebug(
        'returnUrl: ' +
        (
          returnUrl
            ? 'ADA'
            : 'TIADA'
        ) +
        '\n' +
        'callback code: ' +
        (
          callbackCode
            ? 'ADA'
            : 'TIADA'
        )
      );


      document
        .getElementById(
          'startButton'
        )
        .classList
        .add(
          'hidden'
        );


      return;

    }


    /*
     * Semak sokongan kamera.
     */

    if (
      !checkEnvironment()
    ) {

      document
        .getElementById(
          'startButton'
        )
        .classList
        .add(
          'hidden'
        );


      return;

    }


    /*
     * Scanner sedia.
     */

    showStatus(
      '✅ Scanner sedia. Tekan AKTIFKAN KAMERA.',
      'info'
    );

  }
);


</script>
