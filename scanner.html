<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>QR AKTIF! — Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101418;
  color: #fff;
  font-family: Arial, sans-serif;
}

.wrap {
  max-width: 560px;
  margin: auto;
  padding: 18px;
}

.card {
  background: #1b232c;
  border-radius: 18px;
  padding: 18px;
}

h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

p {
  color: #cbd5df;
}

#reader {
  width: 100%;
  margin: 18px auto 12px;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
  font-weight: bold;
}

#status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: #253241;
}

.ok {
  background: #164b2b !important;
}

.err {
  background: #5a1e25 !important;
}

.hint {
  margin-top: 12px;
  font-size: 13px;
  color: #aebdca;
  line-height: 1.45;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>📷 QR AKTIF! — Scanner</h1>

    <p>
      Halakan kamera belakang iPhone kepada QR murid.
    </p>

    <div id="reader"></div>

    <div id="status">
      Memulakan kamera...
    </div>

    <button onclick="closeScanner()">
      ✕ TUTUP SCANNER
    </button>

    <div class="hint">
      Jika iPhone meminta kebenaran kamera, pilih
      <b>Allow</b>.
    </div>

  </div>
</div>

<script>

let scanner = null;
let running = false;
let completed = false;


/* ================================
   STATUS
================================ */

function status(message, type) {

  const el = document.getElementById('status');

  el.textContent = message;

  el.className = type || '';

}


/* ================================
   DAPATKAN ID DARIPADA QR
================================ */

function extractId(text) {

  let value = String(text || '').trim();

  try {

    const url = new URL(value);

    const id = url.searchParams.get('id');

    if (id) {
      value = id;
    }

  } catch (e) {}

  return value.trim().toUpperCase();

}


/* ================================
   MULAKAN KAMERA
================================ */

async function startCamera() {

  if (typeof Html5Qrcode === 'undefined') {

    status(
      '❌ Library QR gagal dimuat.',
      'err'
    );

    return;
  }

  scanner = new Html5Qrcode('reader');

  const config = {

    fps: 10,

    qrbox: function(width, height) {

      const size =
        Math.floor(
          Math.min(width, height) * 0.72
        );

      return {
        width: size,
        height: size
      };

    },

    aspectRatio: 1.0

  };


  try {

    await scanner.start(

      {
        facingMode: 'environment'
      },

      config,

      function(decodedText) {

        if (completed) {
          return;
        }

        const id =
          extractId(decodedText);

        if (!id) {

          status(
            '❌ QR tidak mengandungi ID murid.',
            'err'
          );

          return;
        }

        completed = true;

        status(
          '✅ QR dibaca: ' + id,
          'ok'
        );

        finishScan(id);

      },

      function() {
        // Abaikan frame yang belum berjaya dibaca.
      }

    );

    running = true;

    status(
      '📷 Kamera aktif — halakan kepada QR murid.'
    );

  }

  catch (error) {

    console.error(error);

    status(
      '❌ Kamera tidak dapat dibuka. Pastikan Camera = Allow.',
      'err'
    );

  }

}


/* ================================
   SELEPAS QR BERJAYA DIBACA
================================ */

async function finishScan(id) {
  try {
    if (scanner && running) {
      await scanner.stop();
      running = false;
    }
  } catch (e) {}

  const params = new URLSearchParams(window.location.search);

  const returnUrl = params.get('returnUrl');
  const code = params.get('code');

  if (!returnUrl || !code) {
    status(
      '❌ Maklumat kembali ke QR AKTIF tidak lengkap.',
      'err'
    );
    return;
  }

  let destination;

  try {
    const url = new URL(returnUrl);

    url.searchParams.set('id', id);
    url.searchParams.set('code', code);

    destination = url.toString();

  } catch (e) {

    status(
      '❌ URL QR AKTIF tidak sah.',
      'err'
    );

    return;
  }

  status(
    '✅ QR ' + id + ' berjaya dibaca. Kembali ke QR AKTIF...',
    'ok'
  );

  setTimeout(function() {
    window.location.replace(destination);
  }, 500);
}

  /* ================================
     TIADA RETURN URL
  ================================= */

  if (!returnUrl) {

    status(
      '❌ URL QR AKTIF tidak ditemui. Sila buka scanner melalui sistem QR AKTIF!',
      'err'
    );

    return;

  }


  /* ================================
     BINA URL KEMBALI
  ================================= */

  let destination;

  try {

    const url =
      new URL(returnUrl);

    /*
     * ID murid dihantar sebagai:
     *
     * ?id=6AG-001
     */

    url.searchParams.set(
      'id',
      id
    );

    destination =
      url.toString();

  }

  catch (e) {

    status(
      '❌ URL QR AKTIF tidak sah.',
      'err'
    );

    return;

  }


  /* ================================
     PAPAR STATUS
  ================================= */

  status(
    '✅ QR ' + id +
    ' berjaya dibaca. Kembali ke QR AKTIF...',
    'ok'
  );


  /*
   * TUNGGU SEDIKIT SUPAYA GURU NAMPAK
   * STATUS BERJAYA
   */

  setTimeout(function() {

    window.location.href =
      destination;

  }, 500);

}


/* ================================
   TUTUP
================================ */

async function closeScanner() {
  try {
    if (scanner && running) {
      await scanner.stop();
    }
  } catch (e) {}

  running = false;

  const params =
    new URLSearchParams(window.location.search);

  const returnUrl =
    params.get('returnUrl');

  if (returnUrl) {
    window.location.replace(returnUrl);
  } else {
    window.history.back();
  }
}


/* ================================
   START
================================ */

startCamera();

</script>

</body>
</html>
